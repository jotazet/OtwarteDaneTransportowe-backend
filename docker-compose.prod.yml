# Production override for Docker Compose.
#
# Releases are deployed by GitHub Actions (docs/deployment.md, section 20). By hand
# (single VPS, TLS terminated by an external reverse-proxy such as nginx/Caddy), from a
# checkout:
#   ./scripts/deploy.sh up -d --build
#
# Or manually:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required environment (set in .env, do NOT use development defaults):
#   DJANGO_SETTINGS_MODULE=OtwarteDaneTransportowe.settings_prod
#   DJANGO_SECRET_KEY=<strong unique value>
#   DJANGO_ALLOWED_HOSTS=api.example.org
#   CSRF_TRUSTED_ORIGINS=https://api.example.org
#   CORS_ALLOWED_ORIGINS=https://www.example.org
#   FEED_AUTH_ENCRYPTION_KEY=<Fernet key>  # see docs/deployment.md
#   TRUSTED_PROXY_CIDRS=<reverse proxy addresses>  # production refuses to start without it
#
# The reverse-proxy must forward X-Forwarded-Proto so SECURE_PROXY_SSL_HEADER works.

# The project name decides the names of the database volume and the networks, so it must not
# follow the name of the directory the files are deployed in.
name: otwartedanetransportowe-backend

# The application services run the code baked into the image, not the checkout: the base
# file bind-mounts the project over /app for development, which in production let running
# workers import the next release's modules the moment the checkout changed. Only the
# data directories stay mounted. `!override` needs Docker Compose 2.24.4 or newer.
x-prod-app: &prod-app
  # CI builds and pushes the image of every release tag; a release sets ODT_VERSION to it
  # (scripts/deploy/release.sh). The build section stays for building by hand.
  image: ${ODT_BACKEND_IMAGE:-ghcr.io/jotazet/odt-backend}:${ODT_VERSION:-latest}
  build:
    args:
      INSTALL_DEV: "false"
  volumes: !override
    - ./uploaded_data:/app/uploaded_data
    - ./planner_data:/app/planner_data
  # Wins over the env_files, where .env.example sets the development settings. A service
  # missing below still gets the production ones from the server's .env (host file).
  environment:
    DJANGO_SETTINGS_MODULE: OtwarteDaneTransportowe.settings_prod

services:
  # No host ports for the data services: the host is shared, so a port on 127.0.0.1 is
  # still reachable by every local user and process. The application reaches them over
  # the Compose network; for maintenance use `./scripts/deploy.sh exec postgres ...`.
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  web:
    <<: *prod-app
    command: >
      gunicorn OtwarteDaneTransportowe.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3}
      --threads ${GUNICORN_THREADS:-4}
      --timeout 120
      --no-control-socket

  celery_worker:
    <<: *prod-app

  celery_realtime_worker:
    <<: *prod-app

  celery_beat:
    <<: *prod-app

  celery_validator_worker:
    <<: *prod-app

  celery_planner_worker:
    <<: *prod-app

  migrate:
    <<: *prod-app
    # The image already holds the collected static files (Dockerfile).
    command: python manage.py migrate
