[project]
name = "otwarte-dane-transportowe-backend"
version = "0.0.0"
description = "Backend of Otwarte Dane Transportowe: open public transport data catalogue and feed workflow"
requires-python = "==3.12.*"
dependencies = [
    "django==6.0.1",
    "djangorestframework==3.16.1",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "gunicorn>=23.0.0",
    "whitenoise>=6.6.0",
    "django-filter==25.2",
    "psycopg2-binary>=2.9.9",
    "pillow>=10.0.0",
    "requests>=2.32.0",
    # GTFS-RT protobuf parsing (validates fetched realtime bodies before caching)
    "gtfs-realtime-bindings>=1.0.0",
    "cryptography>=42.0.0",
    "drf-spectacular[sidecar]==0.29.0",
    "celery[redis]>=5.4.0",
    "django-celery-beat>=2.7.0",
    # Docker client for the GTFS validator container
    "docker>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-django==4.12.0",
    "ruff>=0.17.0",
]

[tool.uv]
# An application, not a library: install the dependencies only.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated by makemigrations; never hand-formatted.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade,
# DTZ naive datetimes, DJ Django.
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "DJ"]
ignore = [
    # Line length is the formatter's job; the rest are long strings and URLs.
    "E501",
    # null=True on CharField: fixing it needs data migrations and changes the
    # API contract (null becomes ""), so it is a separate task.
    "DJ001",
]

[tool.ruff.lint.per-file-ignores]
# Layered settings import everything from settings_base.
"OtwarteDaneTransportowe/settings_*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "preserve"
