[project]
name = "otwarte-dane-transportowe-backend"
version = "0.0.0"
description = "Backend of Otwarte Dane Transportowe: open public transport data catalogue and feed workflow"
requires-python = "==3.12.*"
dependencies = [
    "django==6.0.1",
    "djangorestframework==3.16.1",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "gunicorn>=23.0.0",
    "whitenoise>=6.6.0",
    "django-filter==25.2",
    "psycopg2-binary>=2.9.9",
    "pillow>=10.0.0",
    "requests>=2.32.0",
    # GTFS-RT protobuf parsing (validates fetched realtime bodies before caching)
    "gtfs-realtime-bindings>=1.0.0",
    "cryptography>=42.0.0",
    "drf-spectacular[sidecar]==0.29.0",
    "celery[redis]>=5.4.0",
    "django-celery-beat>=2.7.0",
    # Docker client for the GTFS validator container
    "docker>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-django==4.12.0",
    "ruff>=0.17.0",
]

[tool.uv]
# An application, not a library: install the dependencies only.
package = false
