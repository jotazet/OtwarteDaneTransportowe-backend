# App secrets and Django config are loaded from .env via env_file (not ${VAR}
# interpolation) so passwords/keys may contain '$' without breaking Compose.
x-app-env: &app-env
  HOME: /app
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  # Shared cache: required so the realtime self-scheduling lock and DRF throttling
  # work across web + worker processes (per-process LocMemCache would break them).
  REDIS_CACHE_URL: redis://redis:6379/2

x-app-service: &app-service
  build:
    context: .
    # Dev image includes pytest and ruff; docker-compose.prod.yml turns it off.
    args:
      INSTALL_DEV: "true"
  restart: unless-stopped
  user: "${UID:-1000}:${GID:-1000}"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  env_file:
    - path: .env.example
      required: false
    - path: .env
      required: false
  environment:
    <<: *app-env
  volumes:
    - .:/app

services:
  # Bind-mounted project dir often yields root-owned uploaded_data; app runs as UID:GID.
  init_uploads:
    image: alpine:3.20
    container_name: odt-init-uploads
    restart: "no"
    volumes:
      - .:/app
    environment:
      TARGET_UID: "${UID:-1000}"
      TARGET_GID: "${GID:-1000}"
    # Script avoids Compose $$ escaping bugs with ${...} in inline YAML.
    command: ["sh", "/app/scripts/docker-init-uploads.sh"]

  postgres:
    image: postgres:16
    container_name: odt-postgres
    restart: unless-stopped
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5420}:5432"
    volumes:
      - odt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: odt-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app-service
    container_name: odt-migrate
    restart: "no"
    # collectstatic runs here too: the bind-mount (.:/app) shadows the staticfiles
    # baked into the image, so assets must be regenerated into the host-mounted dir
    # on each deploy for WhiteNoise to serve /static/ (admin, DRF, Swagger CSS).
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput"
    depends_on:
      init_uploads:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *app-service
    container_name: odt-web
    command: python manage.py runserver 0.0.0.0:8000
    # 'planner' lets the journey planner's OTP poll realtime files from here.
    networks: [default, planner]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${WEB_HOST_BIND:-127.0.0.1}:${WEB_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    <<: *app-service
    container_name: odt-celery-worker
    command: >
      celery -A OtwarteDaneTransportowe worker
      --loglevel=info
      --queues=default
      --concurrency=${CELERY_DEFAULT_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully

  celery_beat:
    <<: *app-service
    container_name: odt-celery-beat
    # DatabaseScheduler — harmonogram trzymany w PostgreSQL (tabela PeriodicTask)
    command: >
      celery -A OtwarteDaneTransportowe beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Least-privilege gateway to the host Docker API for the GTFS validator
  # worker. Only this container mounts /var/run/docker.sock; the worker talks
  # to it over TCP with everything except the needed endpoints denied.
  #
  # Honest caveat: the containers-create API still accepts bind mounts and the
  # privileged flag, so a compromised worker remains dangerous — the proxy
  # removes exec/volumes/images-tampering and shrinks the surface, it does not
  # eliminate it. Full closure = rootless Docker or a separate validator
  # microservice (see docs/deployment.md).
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: odt-docker-socket-proxy
    restart: unless-stopped
    environment:
      # Allowed: list/inspect/create/start/wait/logs/remove containers + image pull.
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      # Everything else (EXEC, VOLUMES, NETWORKS, SECRETS, SWARM, ...) stays denied.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  celery_validator_worker:
    <<: *app-service
    container_name: odt-celery-validator-worker
    # ┌──────────────────────────── SECURITY NOTE ────────────────────────────────┐
    # │ This worker runs the GTFS validator image via the docker-socket-proxy     │
    # │ service above (DOCKER_HOST) — it has no direct /var/run/docker.sock       │
    # │ access. Validator containers additionally run with network_disabled,      │
    # │ a non-root user, --rm and bounded mem/pids/cpu limits                     │
    # │ (see data_manager/tasks.py:validate_gtfs_feed_task).                      │
    # └───────────────────────────────────────────────────────────────────────────┘
    command: >
      celery -A OtwarteDaneTransportowe worker
      --loglevel=info
      --queues=feeds
      --concurrency=${CELERY_FEEDS_CONCURRENCY:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_started
    environment:
      <<: *app-env
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
      HOST_PROJECT_PATH: "${HOST_PROJECT_PATH:-${PWD}}"
      HOST_MEDIA_ROOT: "${HOST_MEDIA_ROOT:-${PWD}/uploaded_data}"

  # NOTE: the gtfs-realtime-validator service was removed deliberately.
  #
  # It ran 24/7 on an OpenJDK 11 image with no mem_limit, so the JVM sized its
  # heap at 25% of HOST RAM (measured: MaxHeapSize = 3.88 GB) — the bulk of this
  # stack's memory footprint. What it bought was nothing: the integration in
  # data_manager/tasks.py registered feeds with it and never read a result back,
  # so no finding could ever reach a submission.
  #
  # GTFS-RT bodies are now validated in-process: the protobuf is actually parsed
  # (validators._validate_gtfs_rt_protobuf) instead of being checked for a '<'.
  # If semantic validation is wanted later, bring the service back WITH a
  # mem_limit and a JAVA_TOOL_OPTIONS heap cap, and implement the result polling.

  # ── Journey planner (opt in with COMPOSE_PROFILES=planner) ─────────────────
  # Builds the OpenTripPlanner graph on the 'planner' queue and stops/starts the
  # `otp` container through docker-socket-proxy. Concurrency 2: one slot for a
  # build (minutes to hours), one for planner.ensure_serving.
  celery_planner_worker:
    <<: *app-service
    container_name: odt-celery-planner-worker
    profiles: [planner]
    command: >
      celery -A OtwarteDaneTransportowe worker
      --loglevel=info
      --queues=planner
      --concurrency=2
    depends_on:
      migrate:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_started
    environment:
      <<: *app-env
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
      HOST_PROJECT_PATH: "${HOST_PROJECT_PATH:-${PWD}}"
      HOST_PLANNER_DATA_DIR: "${HOST_PLANNER_DATA_DIR:-${PWD}/planner_data}"
    networks: [default, planner]

  # The serving OpenTripPlanner. Private: no published port, only on the
  # 'planner' network with web and the planner worker (not with postgres, redis
  # or docker-socket-proxy). It reaches the internet only for realtime URLs of
  # feeds that ODT does not proxy (ADR 0009). `serving` is a symlink to the
  # active graph; the planner worker repoints it and restarts this container.
  otp:
    image: ${PLANNER_OTP_IMAGE:-opentripplanner/opentripplanner:2.10.0}
    container_name: odt-otp
    profiles: [planner]
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Wait for the first graph instead of crash-looping until the first build.
    entrypoint:
      - sh
      - -c
      - until [ -f /var/opentripplanner/graph.obj ]; do sleep 30; done; exec /docker-entrypoint.sh --load
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx${PLANNER_OTP_SERVE_HEAP:-6g} -XX:+ExitOnOutOfMemoryError"
      # Sent with polls of proxied realtime files (router-config.json uses ${PLANNER_INTERNAL_TOKEN}).
      PLANNER_INTERNAL_TOKEN: "${PLANNER_INTERNAL_TOKEN:-}"
    mem_limit: ${PLANNER_OTP_SERVE_MEM_LIMIT:-7g}
    volumes:
      - ${HOST_PLANNER_DATA_DIR:-./planner_data}/serving:/var/opentripplanner:ro
    networks: [planner]

networks:
  planner:
    name: odt-planner

volumes:
  odt_pgdata:
