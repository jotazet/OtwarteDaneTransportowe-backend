name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only the newest run of a pull request matters. Pushes to main get a group each
# (the run ID): a shared group would cancel a waiting run when the next one queues.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      # Settings default to postgres/postgres on 127.0.0.1:5420; tests need no
      # Redis (the cache falls back to local memory without REDIS_CACHE_URL).
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: otwarte_dane_transportowe
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5420:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      # The fast checks go first, so lint errors show before the tests run.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The production image: no dev dependencies.
      - run: docker build --build-arg INSTALL_DEV=false --tag odt-backend .
      - run: docker run --rm --entrypoint gunicorn odt-backend --version
